<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Rodados Córdoba — Tu primer 0km</title>
<style>
  @font-face { font-family: M; font-weight: 500; src: url(fonts/montserrat-latin-500-normal.woff2); }
  @font-face { font-family: M; font-weight: 600; src: url(fonts/montserrat-latin-600-normal.woff2); }
  @font-face { font-family: M; font-weight: 700; src: url(fonts/montserrat-latin-700-normal.woff2); }
  @font-face { font-family: M; font-weight: 800; src: url(fonts/montserrat-latin-800-normal.woff2); }
  :root { --orange: #FF7F00; --black: #1D1E1C; --white: #F3F2F3; --tshadow: 0 4px 22px rgba(0,0,0,.5), 0 1px 3px rgba(0,0,0,.35); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; font-family: M, sans-serif; }
  .abs { position: absolute; }
  .full { left: 0; top: 0; width: 1080px; height: 1920px; }
  .tW { color: #FFFFFF; text-shadow: var(--tshadow); }
  .tO { color: #FF8A1A; text-shadow: var(--tshadow); }
  /* cada palabra sube desde una "ranura" invisible (máscara solo vertical) */
  .mk { display: inline-block; vertical-align: top; clip-path: inset(-.3em -60% -.3em -60%); }
  .in { display: inline-block; white-space: pre; }
  .center { left: 0; width: 1080px; text-align: center; }

  /* autos */
  .car { left: 0; top: 0; width: 1080px; height: 1920px; pointer-events: none; }
  .carBox { position: absolute; left: 30px; width: 1020px; }
  .floor { position: absolute; left: 50%; bottom: -70px; width: 1100px; height: 190px; transform: translateX(-50%); border-radius: 50%;
    background: radial-gradient(ellipse at center, rgba(255,140,30,.55) 0%, rgba(255,110,0,.22) 40%, rgba(255,110,0,0) 70%); mix-blend-mode: screen; }
  .shadow { position: absolute; left: 50%; bottom: -22px; width: 860px; height: 80px; transform: translateX(-50%); border-radius: 50%;
    background: radial-gradient(ellipse at center, rgba(0,0,0,.85) 0%, rgba(0,0,0,0) 70%); }
  .imgWrap { position: absolute; left: 50%; bottom: 0; transform: translateX(-50%); }
  .imgWrap img { display: block; width: 100%; }
  .glare { position: absolute; inset: 0; background: linear-gradient(100deg, rgba(255,235,210,0) 42%, rgba(255,240,220,.6) 50%, rgba(255,235,210,0) 58%);
    background-size: 320% 100%; -webkit-mask-size: 100% 100%; mask-size: 100% 100%; mix-blend-mode: screen; }
  .rim { position: absolute; inset: 0; -webkit-mask-size: 100% 100%; mask-size: 100% 100%; background: linear-gradient(180deg, rgba(255,140,40,0) 55%, rgba(255,140,40,.28) 100%); mix-blend-mode: screen; }

  /* fondos */
  #b1 { background: url(../assets/fondos/interior-citroen.webp) 30% 40%/cover; filter: brightness(.9) contrast(1.05) saturate(.9); transform-origin: 40% 45%; }
  #b1shade { background: linear-gradient(180deg, rgba(0,0,0,.45) 0%, rgba(0,0,0,.15) 40%, rgba(0,0,0,0) 65%, rgba(0,0,0,.3) 100%), linear-gradient(rgba(255,120,20,.10), rgba(255,120,20,.10)); }
  #b2 { background: url(../assets/fondos/aircross-ruta.webp) center/cover; filter: brightness(1.05) contrast(1.05); transform-origin: 55% 60%; }
  #b2tint { background: radial-gradient(ellipse 60% 30% at 50% 46%, rgba(0,0,0,.35) 0%, rgba(0,0,0,0) 100%), linear-gradient(180deg, rgba(10,4,0,.3), rgba(60,22,0,.1) 50%, rgba(0,0,0,.4)); }
  #b3 { background: radial-gradient(ellipse 95% 50% at 50% 68%, #B8540E 0%, #5E2A0A 50%, #24120A 100%); }
  .bphoto { background-size: cover; background-position: center; filter: brightness(.95) contrast(1.05) saturate(1.05); }
  #bshade { background: linear-gradient(180deg, rgba(0,0,0,.45) 0%, rgba(0,0,0,.15) 32%, rgba(0,0,0,0) 48%, rgba(0,0,0,0) 70%, rgba(0,0,0,.4) 100%), linear-gradient(rgba(255,120,20,.08), rgba(255,120,20,.08)); }
  #b3haze { background: radial-gradient(ellipse 55% 25% at 85% 18%, rgba(255,110,0,.3), rgba(255,110,0,0) 70%); }
  #leak { pointer-events: none; mix-blend-mode: screen; background: radial-gradient(ellipse 50% 30% at 50% 50%, rgba(255,150,60,.55), rgba(255,120,20,0) 70%); }
  #b4 { background: radial-gradient(ellipse 90% 40% at 50% 100%, rgba(255,120,0,.65) 0%, rgba(255,110,0,0) 70%), radial-gradient(ellipse 80% 50% at 50% 40%, #7A3A0C 0%, #2A1408 75%); }

  /* Escena 1: hook */
  #logo1 { left: 410px; top: 175px; width: 260px; filter: drop-shadow(0 4px 16px rgba(0,0,0,.5)); }
  #hook { top: 445px; }
  #q { font-weight: 800; font-size: 80px; letter-spacing: 5px; }
  #band { margin-top: 12px; font-weight: 800; font-size: 56px; letter-spacing: 9px; }
  #l3 { margin-top: 10px; font-weight: 800; font-size: 110px; letter-spacing: 3px; line-height: 1.05; }
  #okm { font-weight: 800; font-size: 310px; line-height: .95; letter-spacing: 6px; }
  /* auto del hook en primer plano: entero a la izquierda, recortado a la derecha y abajo, tapando el pie de "0KM" */
  #car1 .carBox { top: 860px; height: 1110px; }
  #car1 .imgWrap { left: 692px; }
  #car1 .floor, #car1 .shadow { display: none; }

  /* Escena 2: logo */
  #logo2 { left: 200px; top: 700px; width: 680px; }
  #slogan2 { top: 1100px; font-weight: 700; font-size: 34px; letter-spacing: 8px; }

  /* Escena 3: beneficios */
  #btext { top: 330px; }
  #ba { font-weight: 800; line-height: 1; letter-spacing: 3px; }
  #bb { margin-top: 18px; font-weight: 800; font-size: 72px; letter-spacing: 12px; }
  #car3 .carBox { top: 770px; height: 600px; }
  #pat { top: 1430px; }
  #patLine { left: 480px; top: 1404px; width: 120px; height: 6px; border-radius: 3px; background: var(--orange); }
  #pat1 { display: inline-flex; align-items: center; gap: 16px; font-weight: 700; font-size: 34px; letter-spacing: 7px; }
  #pat1 svg { width: 44px; height: 44px; filter: drop-shadow(0 3px 10px rgba(0,0,0,.5)); }
  #pat2 { margin-top: 8px; font-weight: 800; font-size: 66px; letter-spacing: 9px; }

  /* Escena 4: cierre */
  #logo4 { left: 255px; top: 520px; width: 570px; }
  #cta { top: 1000px; font-weight: 600; font-size: 54px; letter-spacing: 1px; }
  #web { top: 1095px; font-weight: 700; font-size: 60px; letter-spacing: 3px; }
  #webLine { left: 480px; top: 1190px; width: 120px; height: 6px; border-radius: 3px; background: var(--orange); }
  #slogan4 { top: 1225px; font-weight: 700; font-size: 30px; letter-spacing: 7px; color: rgba(243,242,243,.85); }

  #vig { pointer-events: none; background: radial-gradient(ellipse 80% 62% at 50% 50%, rgba(0,0,0,0) 65%, rgba(0,0,0,.22) 100%); }
  #grain { left: -200px; top: -200px; width: 1480px; height: 2320px; background: url(grain.png); opacity: .06; mix-blend-mode: overlay; pointer-events: none; }
  #fade { background: #000; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <defs id="defs"></defs>
</svg>
<div id="stage" class="abs full" style="overflow:hidden">
 <div id="world" class="abs full">
  <!-- fondos -->
  <div id="g1" class="abs full"><div id="b1" class="abs full"></div><div id="b1shade" class="abs full"></div></div>
  <div id="g2" class="abs full"><div id="b2" class="abs full"></div><div id="b2tint" class="abs full"></div></div>
  <div id="g3" class="abs full"><div id="b3" class="abs full"></div><div id="b3haze" class="abs full"></div><div id="bphotos"></div><div id="bshade" class="abs full"></div></div>
  <div id="g4" class="abs full"><div id="b4" class="abs full"></div></div>

  <!-- estelas de luz (detrás del contenido) -->
  <canvas id="fxBack" class="abs full" width="1080" height="1920"></canvas>
  <div id="leak" class="abs full"></div>

  <!-- contenido -->
  <div id="s1" class="abs full">
    <img id="logo1" class="abs" src="../assets/brand/logo-rodados-blanco.png">
    <div id="hook" class="abs center">
      <div id="q" class="tW split">¿QUERÉS</div>
      <div id="band" class="tO split">RENOVAR O TENER</div>
      <div id="l3" class="tW split">TU PRIMER</div>
      <div id="okm" class="tO split">0KM</div>
    </div>
    <div id="car1" class="car abs"></div>
  </div>

  <div id="s2" class="abs full">
    <img id="logo2" class="abs" src="../assets/brand/logo-rodados-blanco.png">
    <div id="slogan2" class="abs center tW split">MÁS QUE AUTOS, SOLUCIONES</div>
  </div>

  <div id="s3" class="abs full">
    <div id="btext" class="abs center"><div id="ba" class="tW"></div><div id="bb" class="tO"></div></div>
    <div id="cars3"></div>
    <div id="patLine" class="abs"></div>
    <div id="pat" class="abs center">
      <div id="pat1" class="tW"><svg viewBox="0 0 48 48" fill="none" stroke="#FF8A1A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><circle cx="24" cy="24" r="20" stroke-width="3.5"/><path id="check" d="M14 25 L21 32 L34 17"/></svg><span class="split">NOS OCUPAMOS DEL</span></div>
      <div id="pat2" class="tO split">PATENTAMIENTO</div>
    </div>
  </div>

  <div id="s4" class="abs full">
    <img id="logo4" class="abs" src="../assets/brand/logo-rodados-blanco.png">
    <div id="cta" class="abs center tW split">No dudes en consultar</div>
    <div id="web" class="abs center tO split">rodadoscordoba.com</div>
    <div id="webLine" class="abs"></div>
    <div id="slogan4" class="abs center split">MÁS QUE AUTOS, SOLUCIONES</div>
  </div>
 </div>

  <!-- rayos de velocidad y destello de las transiciones (encima de todo) -->
  <canvas id="fxFront" class="abs full" width="1080" height="1920"></canvas>
  <div id="vig" class="abs full"></div>
  <div id="grain" class="abs"></div>
  <div id="fade" class="abs full"></div>
</div>

<script>
// Autos 0km (PNG sin fondo, rutas relativas a assets/autos/) y fotos de fondo (assets/fondos/).
// Cada beneficio puede llevar una foto de fondo desenfocada (photo) y pasa uno o más autos recortados (cars).
const CAR_DIR = '../assets/autos/0km-grade/';
const PHOTO_DIR = '../assets/fondos/';
const HERO = 'peugeot-2008';
const BENEFITS = [
  { a: 'FINANCIACIÓN', size: 104, b: 'A TASA FIJA', photo: 'aircross-ruta.webp', cars: ['peugeot-208', 'citroen-c3-aircross'] },
  { a: '0%', size: 250, b: 'INTERÉS', photo: 'tracker-rojo.webp', cars: ['fiat-cronos', 'chevrolet-tracker'] },
  { a: 'ACEPTAMOS', size: 120, b: 'TU USADO', cars: ['renault-kardian'] },
];
const DURATION = 17.8;

// Línea de tiempo (segundos)
const T = {
  cuts: [3.9, 5.7, 14.35], // hook | logo | beneficios | cierre
  beats: [5.85, 8.85, 11.85],
};

// --- utilidades ---
const W = 1080, H = 1920;
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, p) => a + (b - a) * p;
const eOut = p => 1 - Math.pow(1 - p, 3);
const eIn = p => p * p * p;
const eInOut = p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
const eBack = p => { const c = 1.70158, c3 = c + 1; return 1 + c3 * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); };
const hash = n => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const rng = seed => () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const $ = id => document.getElementById(id);
const css = (el, o) => Object.assign(el.style, o);
const show = (el, on) => { el.style.display = on ? 'block' : 'none'; };
const eExpo = p => p >= 1 ? 1 : 1 - Math.pow(2, -10 * p);

// Envuelve cada palabra en una máscara para animarla
function words(el) {
  el.innerHTML = el.textContent.split(' ').map(w => `<span class="mk"><span class="in">${w}</span></span>`).join(' ');
  const cs = getComputedStyle(el);
  el._ls = parseFloat(cs.letterSpacing) || 0; el._fs = parseFloat(cs.fontSize);
}
document.querySelectorAll('.split').forEach(words);

// Cada palabra sube desde su máscara mientras el espaciado se cierra; al salir, sigue de largo hacia arriba
function reveal(el, t, start, outAt = Infinity, step = .08, dur = .8) {
  el.querySelectorAll('.in').forEach((w, k) => {
    const p = eExpo(prog(t, start + k * step, start + k * step + dur));
    const q = outAt === Infinity ? 0 : eIn(prog(t, outAt + k * .04, outAt + k * .04 + .35));
    css(w, { transform: `translateY(${(1 - p) * 140 - q * 140}%)`, letterSpacing: `${el._ls + (1 - p) * .14 * el._fs}px` });
  });
}

// ---------- Estelas de luz ----------
const COLORS = [[255, 127, 0], [255, 150, 40], [255, 186, 96], [255, 95, 0], [255, 212, 150]];
function makeTrail(xs, ys, r) {
  const n = xs.length, cum = new Float32Array(n);
  for (let i = 1; i < n; i++) cum[i] = cum[i - 1] + Math.hypot(xs[i] - xs[i - 1], ys[i] - ys[i - 1]);
  return { xs, ys, cum, len: cum[n - 1], w: 1.5 + r() * 4.5, c: COLORS[Math.floor(r() * COLORS.length)],
    speed: .22 + r() * .35, phase: r() * 1.6, tail: .16 + r() * .26, base: .05 + r() * .12, bright: .55 + r() * .45, comets: r() < .45 ? 2 : 1 };
}
function arcPts(cx, cy, rx, ry, a0, a1, rot, n = 180) {
  const xs = [], ys = [], cr = Math.cos(rot * Math.PI / 180), sr = Math.sin(rot * Math.PI / 180);
  for (let i = 0; i < n; i++) {
    const a = (a0 + (a1 - a0) * i / (n - 1)) * Math.PI / 180, x = Math.cos(a) * rx, y = Math.sin(a) * ry;
    xs.push(cx + x * cr - y * sr); ys.push(cy + x * sr + y * cr);
  }
  return [xs, ys];
}
function bezPts(p0, p1, p2, p3, n = 180) {
  const xs = [], ys = [];
  for (let i = 0; i < n; i++) {
    const u = i / (n - 1), v = 1 - u, a = v * v * v, b = 3 * v * v * u, c = 3 * v * u * u, d = u * u * u;
    xs.push(a * p0[0] + b * p1[0] + c * p2[0] + d * p3[0]); ys.push(a * p0[1] + b * p1[1] + c * p2[1] + d * p3[1]);
  }
  return [xs, ys];
}
function family(n, seed, gen, opts = {}) {
  const r = rng(seed);
  return Array.from({ length: n }, (_, i) => { const [xs, ys] = gen(i, r); const tr = makeTrail(xs, ys, r); if (opts.each) opts.each(tr, i); return tr; });
}
const FAM = {
  // remolino de luz bajo el auto del hook
  hook: family(16, 7, (i, r) => { const rx = 430 + i * 58 + r() * 20; return arcPts(560, 1500, rx, rx * .27, 205 + r() * 15, -25 - r() * 20, -9); }),
  // haces que convergen hacia el logo
  rush: family(22, 11, (i, r) => { const y = 120 + i * 80 + r() * 30, d = y - 880; return bezPts([-150, y], [350, y + d * .05], [760, 880 + d * .28], [1260, 880 + d * .06]); },
    { each: tr => { const d = Math.abs(tr.ys[0] - 880); tr.bright *= clamp(d / 520, .25, 1); tr.base *= clamp(d / 520, .2, 1); } }),
  // "ruta" de luz debajo de los autos de los beneficios
  road: family(18, 23, (i, r) => { const y = 1400 + i * 40 + r() * 15, d = y - 1400; return bezPts([-250, y + d * .3], [350, y - 30], [800, 1180 + d * .2], [1300, 1130 + d * .06]); }),
  // arcos amplios arriba a la derecha (detrás del titular)
  arcs: family(9, 31, (i, r) => { const rx = 520 + i * 52; return arcPts(1180, 230, rx, rx * .5, 186, 92, 10); },
    { each: tr => { tr.base *= .6; tr.bright *= .55; } }),
  // órbita alrededor del logo de cierre
  orbit: family(14, 41, (i, r) => { const rx = 400 + i * 42; return arcPts(540, 760, rx, rx * .2, -170 + r() * 40, 190 + r() * 40, -12); }),
  // remolino inferior del cierre
  low: family(12, 53, (i, r) => { const y = 1600 + i * 36; return bezPts([-200, y + 80], [300, y], [800, 1520 + i * 10], [1300, 1470 + i * 4]); }),
};

const back = $('fxBack').getContext('2d'), front = $('fxFront').getContext('2d');
const mkOff = () => { const c = document.createElement('canvas'); c.width = W; c.height = H; return c.getContext('2d'); };
const sharpB = mkOff(), sharpF = mkOff();

function idxAt(tr, u) {
  const L = clamp(u) * tr.len, cum = tr.cum;
  let lo = 0, hi = cum.length - 1;
  while (hi - lo > 1) { const m = (lo + hi) >> 1; if (cum[m] < L) lo = m; else hi = m; }
  return lo + (cum[hi] > cum[lo] ? (L - cum[lo]) / (cum[hi] - cum[lo]) : 0);
}
function strokeRange(ctx, tr, u0, u1) {
  const i0 = idxAt(tr, u0), i1 = idxAt(tr, u1), at = f => { const i = Math.floor(f), k = f - i, j = Math.min(i + 1, tr.xs.length - 1); return [lerp(tr.xs[i], tr.xs[j], k), lerp(tr.ys[i], tr.ys[j], k)]; };
  ctx.beginPath(); ctx.moveTo(...at(i0));
  for (let i = Math.ceil(i0); i < i1; i++) ctx.lineTo(tr.xs[i], tr.ys[i]);
  ctx.lineTo(...at(i1)); ctx.stroke();
}
// tau: tiempo "de la estela" (se acelera en los golpes); reveal: cuánto del trazo está dibujado
function drawFamily(ctx, fam, tau, reveal = 1, inten = 1) {
  if (inten <= 0) return;
  ctx.lineCap = 'round';
  for (const tr of fam) {
    const [r, g, b] = tr.c;
    ctx.lineWidth = tr.w * .6; ctx.strokeStyle = `rgba(${r},${g},${b},${tr.base * inten})`;
    if (reveal > 0) strokeRange(ctx, tr, 0, reveal);
    for (let c = 0; c < tr.comets; c++) {
      const head = ((tau * tr.speed + tr.phase + c * .8) % 1.6) - .3;
      const M = 16;
      for (let k = 0; k < M; k++) {
        const ua = Math.max(0, head - tr.tail + tr.tail * k / M), ub = Math.min(reveal, head - tr.tail + tr.tail * (k + 1) / M);
        if (ub <= ua) continue;
        const a = (k + 1) / M, al = inten * tr.bright * Math.pow(a, 1.8);
        ctx.lineWidth = tr.w * (.4 + .9 * a); ctx.strokeStyle = `rgba(${r},${g},${b},${al})`; strokeRange(ctx, tr, ua, ub);
        if (a > .5) { ctx.lineWidth = tr.w * .35; ctx.strokeStyle = `rgba(255,244,228,${al * .85})`; strokeRange(ctx, tr, ua, ub); }
      }
    }
  }
}
// Rayas de velocidad horizontales (detrás de un auto en movimiento o en las transiciones)
function speedLines(ctx, seed, n, x0, y0, y1, len, alpha, t) {
  if (alpha <= 0.01) return;
  const r = rng(seed);
  ctx.lineCap = 'round';
  for (let i = 0; i < n; i++) {
    const y = lerp(y0, y1, r()), l = len * (.4 + r() * .6), off = ((t * (900 + r() * 900) + r() * 400) % 400), x = x0 + off;
    const c = COLORS[Math.floor(r() * COLORS.length)], w = 1.5 + r() * 4;
    const g = ctx.createLinearGradient(x, 0, x + l, 0);
    g.addColorStop(0, `rgba(255,240,220,${alpha * (.5 + r() * .5)})`); g.addColorStop(.3, `rgba(${c[0]},${c[1]},${c[2]},${alpha * .7})`); g.addColorStop(1, `rgba(${c[0]},${c[1]},${c[2]},0)`);
    ctx.strokeStyle = g; ctx.lineWidth = w; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + l, y); ctx.stroke();
  }
}
// Copia el trazo nítido con dos pasadas de desenfoque sumadas = brillo neón
function bloom(dst, src) {
  dst.clearRect(0, 0, W, H);
  dst.globalCompositeOperation = 'lighter';
  dst.filter = 'blur(18px)'; dst.drawImage(src.canvas, 0, 0);
  dst.filter = 'blur(5px)'; dst.drawImage(src.canvas, 0, 0);
  dst.filter = 'none'; dst.drawImage(src.canvas, 0, 0);
  dst.globalCompositeOperation = 'source-over';
}

// ---------- Autos ----------
let mbN = 0;
function makeCar(holder, name, maxW, maxH) {
  const id = 'mb' + mbN++;
  $('defs').insertAdjacentHTML('beforeend', `<filter id="${id}" x="-30%" y="-10%" width="160%" height="120%"><feGaussianBlur stdDeviation="0 0"/></filter>`);
  const src = CAR_DIR + name + '.png';
  holder.innerHTML = `<div class="carBox"><div class="floor"></div><div class="shadow"></div><div class="imgWrap"><img src="${src}"><div class="glare"></div><div class="rim"></div></div></div>`;
  const wrap = holder.querySelector('.imgWrap'), img = wrap.querySelector('img');
  for (const m of wrap.querySelectorAll('.glare, .rim')) { m.style.webkitMaskImage = m.style.maskImage = `url(${src})`; }
  const fit = () => { const ar = img.naturalWidth / img.naturalHeight; wrap.style.width = Math.min(maxW, maxH * ar) + 'px'; };
  const car = { el: holder, img, glare: wrap.querySelector('.glare'), blur: $(id).firstChild, id, ready: img.decode().then(fit).catch(() => {}) };
  img.style.filter = `url(#${id}) drop-shadow(0 20px 18px rgba(0,0,0,.6))`;
  return car;
}
const car1 = makeCar($('car1'), HERO, 1400, 1100);
// fin de cada beneficio y turnos de cada auto dentro de él
const beatEnd = i => i < T.beats.length - 1 ? T.beats[i + 1] : T.cuts[2];
const SLOTS = BENEFITS.flatMap((b, i) => b.cars.map((name, k) => {
  const len = (beatEnd(i) - T.beats[i]) / b.cars.length;
  return { name, s: T.beats[i] + k * len, e: T.beats[i] + (k + 1) * len };
}));
SLOTS[SLOTS.length - 1].e = Infinity;   // el último auto se queda hasta el cierre
const cars3 = SLOTS.map(sl => { const d = document.createElement('div'); d.className = 'car abs'; d.id = 'car3'; $('cars3').appendChild(d); return makeCar(d, sl.name, 1020, 600); });
const photos3 = BENEFITS.map(b => { if (!b.photo) return null; const d = document.createElement('div'); d.className = 'abs full bphoto'; d.style.backgroundImage = `url(${PHOTO_DIR + b.photo})`; $('bphotos').appendChild(d); return d; });
// Las fotos entran y salen como un barrido rápido con desenfoque
const photoX = (i, t) => {
  const s = T.beats[i], e = beatEnd(i);
  let x = i === 0 ? 0 : lerp(1080, 0, eOut(prog(t, s - .05, s + .45)));
  if (i < T.beats.length - 1) x = lerp(x, -1080, eIn(prog(t, e - .3, e + .05)));
  return x;
};

function placeCar(car, x, vx, glareP, extraY = 0) {
  css(car.el, { transform: `translate(${x}px, ${extraY}px)`, display: Math.abs(x) > 1280 ? 'none' : 'block' });
  car.blur.setAttribute('stdDeviation', `${Math.min(45, Math.abs(vx) / 110)} 0`);
  car.glare.style.backgroundPosition = `${lerp(100, 0, glareP)}% 0`;
  car.glare.style.opacity = glareP > 0 && glareP < 1 ? 1 : 0;
}
const heroX = t => lerp(1500, 0, eOut(prog(t, 1.95, 2.75))) - clamp(t - 2.75, 0, 2) * 10;
const slotX = (i, t) => {
  const { s, e } = SLOTS[i];
  let x = lerp(1300, 0, eOut(prog(t, s + .05, s + .7)));
  if (e !== Infinity) x = lerp(x, -1300, eIn(prog(t, e - .3, e + .05)));
  return x - clamp(t - s - .7, 0, 2) * 10;
};
const vel = (f, t) => (f(t) - f(t - 1 / 30)) * 30;

// Golpes: la estela se acelera cuando entra cada auto
const LANDS = SLOTS.map(sl => sl.s);
const tauBeats = t => t * .9 + LANDS.reduce((s, b) => s + 1.2 * eOut(prog(t, b, b + .9)), 0);

// ---------- Render ----------
let lastBeat = -1;
function render(t) {
  const [c1, c2, c3] = T.cuts;
  sharpB.clearRect(0, 0, W, H);

  // ---------- Escena 1: hook ----------
  const in1 = t < c1;
  show($('g1'), in1); show($('s1'), in1);
  if (in1) {
    css($('b1'), { transform: `scale(${lerp(1.2, 1.05, eOut(prog(t, 0, c1)))}) rotate(${lerp(-2, 0, eOut(prog(t, 0, c1)))}deg)` });
    drawFamily(sharpB, FAM.hook, t * 1.1, eOut(prog(t, .1, 1.5)), 1.25 * prog(t, 0, .3));
    const lg = eOut(prog(t, .1, .6));
    css($('logo1'), { opacity: lg, transform: `translateY(${lerp(-30, 0, lg)}px)` });
    reveal($('q'), t, .25);
    reveal($('band'), t, .45);
    reveal($('l3'), t, .7);
    reveal($('okm'), t, 1.0, Infinity, .08, 1.0);
    css($('okm'), { transform: `scale(${lerp(1.12, 1, eExpo(prog(t, 1.0, 2.2)))})` });
    const vx = vel(heroX, t), x = heroX(t);
    placeCar(car1, x, vx, prog(t, 2.95, 3.6));
    css(car1.el, { transform: `${car1.el.style.transform} scale(${lerp(1.08, 1, eOut(prog(t, 1.95, 3.9)))})`, transformOrigin: '0% 80%' });
    speedLines(sharpB, 5, 18, 540 + x + 500, 1000, 1900, 200 + Math.abs(vx) * .35, clamp(Math.abs(vx) / 2500), t);
    css($('hook'), { transform: `translateY(${-prog(t, 2.8, c1) * 12}px)` });
  }

  // ---------- Escena 2: logo ----------
  const in2 = t >= c1 && t < c2;
  show($('g2'), in2); show($('s2'), in2);
  if (in2) {
    const u = t - c1;
    css($('b2'), { transform: `scale(${lerp(1.08, 1.2, u / (c2 - c1))}) translateX(${-u * 30}px)` });
    drawFamily(sharpB, FAM.rush, u * 2.4 + 3, eOut(prog(u, 0, .5)), 1);
    const lg = eBack(prog(u, .2, .75));
    css($('logo2'), { opacity: prog(u, .2, .45), transform: `scale(${lerp(.6, 1, lg)})`, filter: 'drop-shadow(0 6px 22px rgba(0,0,0,.55))' });
    reveal($('slogan2'), u, .7, Infinity, .06);
  }

  // ---------- Escena 3: beneficios ----------
  const in3 = t >= c2 && t < c3;
  show($('g3'), in3); show($('s3'), in3);
  if (in3) {
    const u = t - c2, tau = tauBeats(t);
    drawFamily(sharpB, FAM.road, tau, eOut(prog(u, 0, .7)), 1.3);
    drawFamily(sharpB, FAM.arcs, tau * .7, eOut(prog(u, .1, 1.1)), 1);

    let bi = 0;
    T.beats.forEach((b, i) => { if (t >= b) bi = i; });
    const B = BENEFITS[bi];
    if (bi !== lastBeat) {
      $('ba').style.fontSize = B.size + 'px';
      $('ba').textContent = B.a; $('bb').textContent = B.b; words($('ba')); words($('bb')); lastBeat = bi;
    }
    const b = T.beats[bi], outA = bi === T.beats.length - 1 ? Infinity : beatEnd(bi) - .32;
    reveal($('ba'), t, b + .05, outA);
    reveal($('bb'), t, b + .22, outA + .06);

    photos3.forEach((ph, i) => {
      if (!ph) return;
      const f = tt => photoX(i, tt), x = f(t), vx = vel(f, t), s = T.beats[i];
      css(ph, { display: Math.abs(x) >= 1080 ? 'none' : 'block', transform: `translateX(${x}px) scale(${lerp(1.18, 1.04, eOut(prog(t, s - .05, beatEnd(i))))})`,
        filter: `brightness(1.05) contrast(1.05) saturate(1.05) blur(${14 + Math.min(18, Math.abs(vx) / 500)}px)` });
    });
    cars3.forEach((car, i) => {
      const s = SLOTS[i].s, f = tt => slotX(i, tt), x = f(t), vx = vel(f, t);
      placeCar(car, x, vx, prog(t, s + .75, s + 1.35), Math.sin((t - s) * 2.4) * 3);
      if (Math.abs(x) < 1280) speedLines(sharpB, 17 + i, 18, 540 + x + (vx < 0 ? 140 : -1500), 880, 1360, 200 + Math.abs(vx) * .35, clamp(Math.abs(vx) / 2500), t);
    });

    // patentamiento: entra con el primer beneficio y queda
    const p0 = T.beats[0] + .6;
    css($('patLine'), { transform: `scaleX(${eOut(prog(t, p0, p0 + .5))})`, opacity: 1 });
    const ck = $('check'), L = 40;
    ck.style.strokeDasharray = L; ck.style.strokeDashoffset = L * (1 - eOut(prog(t, p0 + .2, p0 + .55)));
    css($('pat1').querySelector('svg'), { opacity: prog(t, p0 + .1, p0 + .35), transform: `scale(${lerp(.4, 1, eBack(prog(t, p0 + .1, p0 + .5)))})` });
    reveal($('pat1').querySelector('span'), t, p0 + .15);
    reveal($('pat2'), t, p0 + .3);
  }

  // ---------- Escena 4: cierre ----------
  const in4 = t >= c3;
  show($('g4'), in4); show($('s4'), in4);
  if (in4) {
    const u = t - c3;
    drawFamily(sharpB, FAM.orbit, u * 1.2 + 2, eOut(prog(u, 0, 1.0)), 1);
    drawFamily(sharpB, FAM.low, u + 1, eOut(prog(u, .2, 1.2)), .8);
    const lg = eBack(prog(u, .15, .7));
    css($('logo4'), { opacity: prog(u, .15, .4), transform: `scale(${lerp(.6, 1, lg)})`, filter: 'drop-shadow(0 6px 22px rgba(0,0,0,.5))' });
    reveal($('cta'), u, .6, Infinity, .06);
    reveal($('web'), u, .85);
    css($('webLine'), { transform: `scaleX(${eExpo(prog(u, 1.1, 1.8))})` });
    reveal($('slogan4'), u, 1.25, Infinity, .06);
  }

  // destello de luz cálida que recorre la pantalla (más fuerte cuando aterriza cada auto)
  let pulse = 0;
  for (const b of [1.95, ...LANDS]) pulse += Math.sin(prog(t, b + .45, b + 1.1) * Math.PI);
  css($('leak'), { opacity: .28 + .12 * Math.sin(t * 1.3) + .3 * pulse,
    transform: `translate(${Math.sin(t * .55) * 380}px, ${Math.cos(t * .4) * 520 + 150}px) scale(${1.4 + .3 * Math.sin(t * .8)})` });
  bloom(back, sharpB);

  // ---------- Transiciones: rayos de luz + destello + zoom ----------
  sharpF.clearRect(0, 0, W, H);
  let zoom = 1, blur = 0;
  for (const c of T.cuts) {
    const pre = eIn(prog(t, c - .38, c)), post = 1 - eOut(prog(t, c, c + .4));
    const I = t < c ? pre : post;
    if (I <= 0) continue;
    speedLines(sharpF, Math.round(c * 100), 46, -400 + (t - c) * -2600, 0, H, 500 + 900 * I, I, t);
    const fl = Math.pow(I, 3) * .85;
    const g = sharpF.createRadialGradient(540, 960, 0, 540, 960, 1200);
    g.addColorStop(0, `rgba(255,230,200,${fl})`); g.addColorStop(.5, `rgba(255,140,40,${fl * .7})`); g.addColorStop(1, `rgba(255,100,0,${fl * .3})`);
    sharpF.fillStyle = g; sharpF.fillRect(0, 0, W, H);
    zoom = t < c ? 1 + .1 * pre : 1 + .1 * post; blur = 9 * I;
  }
  // pequeño "golpe" de cámara cuando aterriza cada auto
  for (const b of [1.95, ...LANDS]) zoom += .018 * Math.sin(prog(t, b + .55, b + .95) * Math.PI);
  css($('world'), { transform: `scale(${zoom})`, filter: blur > .1 ? `blur(${blur}px)` : 'none' });
  bloom(front, sharpF);

  const gr = Math.floor(t * 30) * 7919 % 400;
  css($('grain'), { transform: `translate(${gr % 200}px, ${(gr * 3) % 200}px)` });
  css($('fade'), { opacity: Math.max(prog(t, DURATION - .35, DURATION), 1 - prog(t, 0, .2)) });
}

window.DURATION = DURATION;
window.render = render;
window.ready = Promise.all([document.fonts.ready, car1.ready, ...cars3.map(c => c.ready), ...[...document.images].map(i => i.decode().catch(() => {}))]);

if (!navigator.webdriver) {
  window.ready.then(() => {
    const t0 = performance.now();
    (function loop() { render(((performance.now() - t0) / 1000) % DURATION); requestAnimationFrame(loop); })();
  });
} else render(0);
</script>
</body>
</html>
