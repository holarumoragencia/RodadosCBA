<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Rodados Córdoba — Tu primer 0km</title>
<style>
  @font-face { font-family: M; font-weight: 500; src: url(fonts/montserrat-latin-500-normal.woff2); }
  @font-face { font-family: M; font-weight: 600; src: url(fonts/montserrat-latin-600-normal.woff2); }
  @font-face { font-family: M; font-weight: 700; src: url(fonts/montserrat-latin-700-normal.woff2); }
  @font-face { font-family: M; font-weight: 800; src: url(fonts/montserrat-latin-800-normal.woff2); }
  :root { --orange: #FF7F00; --black: #1D1E1C; --white: #F3F2F3; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; font-family: M, sans-serif; }
  .abs { position: absolute; }
  .scene { inset: 0; overflow: hidden; }
  .ch { display: inline-block; white-space: pre; }
  .car { left: 0; top: 0; width: 1080px; height: 1920px; pointer-events: none; }
  .car img { position: absolute; left: 50%; bottom: 0; transform: translateX(-50%); max-width: 1020px; max-height: 620px; filter: drop-shadow(0 20px 18px rgba(20,8,0,.5)); }
  .car .shadow { position: absolute; left: 50%; bottom: -20px; width: 880px; height: 84px; transform: translateX(-50%); border-radius: 50%;
    background: radial-gradient(ellipse at center, rgba(10,4,0,.75) 0%, rgba(10,4,0,0) 70%); }
  .carBox { position: absolute; left: 30px; width: 1020px; }
  .pill { display: inline-flex; align-items: center; gap: 20px; border-radius: 60px; padding: 22px 46px 22px 38px; font-weight: 800; font-size: 38px; letter-spacing: 3px; white-space: nowrap; box-shadow: 0 12px 30px rgba(0,0,0,.4); }
  .tri { width: 0; height: 0; border-top: 16px solid transparent; border-bottom: 16px solid transparent; border-left: 24px solid currentColor; border-radius: 3px; }

  /* Escena 1: hook */
  #s1bg { inset: 0; background: url(../assets/fondo-galpon.webp) center/cover; filter: brightness(.5) saturate(.85); transform-origin: 50% 40%; }
  #s1shade { inset: 0; background: linear-gradient(180deg, rgba(0,0,0,.82) 0%, rgba(0,0,0,.55) 38%, rgba(0,0,0,.2) 62%, rgba(0,0,0,.35) 100%); }
  #wedge { inset: 0; clip-path: polygon(0 79%, 100% 63%, 100% 100%, 0 100%); background: linear-gradient(165deg, #FFA43D 0%, #FF7F00 35%, #D45A00 100%); }
  #wedgeLine { inset: 0; clip-path: polygon(0 77.6%, 100% 61.6%, 100% 62.3%, 0 78.3%); background: var(--white); }
  #logo1 { left: 410px; top: 190px; width: 260px; }
  #hook { left: 0; width: 1080px; top: 395px; text-align: center; }
  #q { color: var(--white); font-weight: 800; font-size: 78px; letter-spacing: 4px; text-shadow: 0 6px 24px rgba(0,0,0,.6); }
  #band { display: inline-block; margin-top: 14px; background: var(--orange); color: var(--black); font-weight: 800; font-size: 58px; letter-spacing: 3px; padding: 6px 30px 4px; transform: rotate(-3deg); box-shadow: 0 10px 26px rgba(0,0,0,.4); }
  #l3 { margin-top: 18px; color: var(--white); font-weight: 800; font-size: 108px; letter-spacing: 2px; line-height: 1.05; text-shadow: 0 6px 24px rgba(0,0,0,.6); }
  #okm { position: relative; display: inline-block; font-weight: 800; font-size: 300px; line-height: .92; letter-spacing: 4px; }
  #okm .o { color: transparent; -webkit-text-stroke: 5px var(--orange); }
  #okm .f { position: absolute; left: 0; top: 0; width: 100%; background: linear-gradient(180deg, #FFB25A 0%, #FF7F00 55%, #E06400 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  #car1 .carBox { top: 1010px; height: 640px; }

  /* Escena 2: logo */
  #s2 { background: radial-gradient(ellipse 80% 55% at 50% 45%, #4a2306 0%, #160b03 55%, #000 100%); }
  #lines2 { left: -300px; top: -200px; width: 1680px; height: 2320px; opacity: .55; }
  #logo2 { left: 200px; top: 700px; width: 680px; }
  #slogan2 { left: 0; width: 1080px; top: 1090px; text-align: center; }
  #slogan2 .pill { background: var(--orange); color: var(--black); font-size: 32px; padding: 16px 34px 16px 28px; gap: 14px; }
  #slogan2 .tri { border-top-width: 12px; border-bottom-width: 12px; border-left-width: 18px; }

  /* Escena 3: beneficios */
  #s3bg { inset: 0; background: url(../assets/fondo-galpon.webp) center/cover; filter: grayscale(1) contrast(1.15) brightness(1.05); transform-origin: 60% 40%; }
  #s3tint { inset: 0; background: linear-gradient(200deg, #FFB347 0%, #FF7F00 45%, #B54A00 100%); mix-blend-mode: multiply; }
  #s3dark { inset: 0; clip-path: polygon(0 71%, 100% 44%, 100% 100%, 0 100%); background: linear-gradient(180deg, #0d0b09 0%, #000 100%); }
  #s3lines { left: 0; top: 0; width: 1080px; height: 1920px; }
  #s3edge { inset: 0; clip-path: polygon(0 70.4%, 100% 43.4%, 100% 44%, 0 71%); background: var(--orange); }
  #tags { left: 70px; top: 360px; transform: rotate(-6deg); transform-origin: 0 50%; }
  .tag { display: block; width: max-content; font-weight: 800; white-space: nowrap; box-shadow: 0 14px 30px rgba(0,0,0,.35); }
  #tag1 { background: var(--white); color: var(--black); font-size: 96px; letter-spacing: 2px; padding: 4px 36px 0; }
  #tag2 { margin-top: 18px; margin-left: 40px; background: var(--black); color: var(--orange); font-size: 78px; letter-spacing: 6px; padding: 6px 36px 2px; }
  #car3 .carBox { top: 770px; height: 600px; }
  #bar { left: 70px; top: 1440px; display: flex; transform: skewX(-12deg); filter: drop-shadow(0 12px 22px rgba(0,0,0,.45)); }
  #barA { width: 130px; height: 112px; background: var(--orange); display: flex; align-items: center; justify-content: center; }
  #barA svg { transform: skewX(12deg); width: 64px; height: 64px; }
  #barB { height: 112px; background: var(--white); display: flex; align-items: center; padding: 0 36px; overflow: hidden; }
  #barB span { display: block; transform: skewX(12deg); color: var(--black); font-weight: 800; font-size: 40px; letter-spacing: 1.5px; white-space: nowrap; line-height: 1.12; }
  #barB b { color: var(--orange); font-weight: 800; }

  /* Escena 4: cierre */
  #s4 { background: radial-gradient(ellipse 90% 45% at 50% 100%, rgba(255,127,0,.42) 0%, rgba(255,127,0,0) 70%), radial-gradient(ellipse 70% 40% at 50% 38%, #2c2d2a 0%, #121211 70%); }
  #lines4 { left: 0; top: 0; width: 1080px; height: 1920px; }
  #logo4 { left: 255px; top: 560px; width: 570px; }
  #cta { left: 0; width: 1080px; top: 900px; text-align: center; color: var(--white); font-weight: 700; font-size: 58px; letter-spacing: 1px; }
  #pills4 { left: 0; width: 1080px; top: 1010px; display: flex; flex-direction: column; align-items: center; gap: 26px; }
  #p4a { background: var(--white); color: var(--black); }
  #p4b { background: var(--orange); color: var(--black); }
  #p4a svg { width: 42px; height: 42px; }

  /* Transición: barras diagonales */
  #wipe { left: 50%; top: 50%; width: 2100px; height: 3600px; margin: -1800px 0 0 -1050px;
    background: linear-gradient(90deg, var(--white) 0 46px, transparent 46px 86px, var(--orange) 86px 2014px, transparent 2014px 2054px, var(--black) 2054px 2100px); }

  #glow { inset: 0; pointer-events: none; background: radial-gradient(ellipse 60% 40% at 50% 6%, rgba(255,210,160,.14), rgba(255,210,160,0) 70%); mix-blend-mode: screen; }
  #vig { inset: 0; pointer-events: none; background: radial-gradient(ellipse 80% 62% at 50% 50%, rgba(0,0,0,0) 60%, rgba(0,0,0,.38) 100%); }
  #grain { left: -200px; top: -200px; width: 1480px; height: 2320px; background: url(grain.png); opacity: .07; mix-blend-mode: overlay; pointer-events: none; }
  #fade { inset: 0; background: #000; }
</style>
</head>
<body>
<div id="stage" class="abs" style="left:0;top:0;width:1080px;height:1920px;overflow:hidden">

  <div id="s1" class="abs scene">
    <div id="s1bg" class="abs"></div>
    <div id="s1shade" class="abs"></div>
    <div id="wedge" class="abs"></div>
    <div id="wedgeLine" class="abs"></div>
    <img id="logo1" class="abs" src="../assets/brand/logo-rodados-blanco.png">
    <div id="hook" class="abs">
      <div id="q" class="split">¿QUERÉS</div>
      <div id="band">RENOVAR O TENER</div>
      <div id="l3" class="split">TU PRIMER</div>
      <div id="okm"><span class="o">0KM</span><span class="f">0KM</span></div>
    </div>
    <div id="car1" class="car abs"><div class="carBox"><div class="shadow"></div><img></div></div>
  </div>

  <div id="s2" class="abs scene">
    <svg id="lines2" class="abs" viewBox="0 0 1680 2320" fill="none" stroke="#FF7F00" stroke-width="3"></svg>
    <img id="logo2" class="abs" src="../assets/brand/logo-rodados-blanco.png">
    <div id="slogan2" class="abs"><span class="pill"><span class="tri"></span>MÁS QUE AUTOS, SOLUCIONES</span></div>
  </div>

  <div id="s3" class="abs scene">
    <div id="s3bg" class="abs"></div>
    <div id="s3tint" class="abs"></div>
    <div id="s3dark" class="abs"></div>
    <svg id="s3lines" class="abs" viewBox="0 0 1080 1920" fill="none" stroke="#FF7F00" stroke-width="3" stroke-linecap="round"></svg>
    <div id="s3edge" class="abs"></div>
    <div id="tags" class="abs"><span id="tag1" class="tag"></span><span id="tag2" class="tag"></span></div>
    <div id="cars3"></div>
    <div id="bar" class="abs">
      <div id="barA"><svg viewBox="0 0 64 64" fill="none" stroke="#1D1E1C" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"><path id="check" d="M12 34 L26 48 L53 17"/></svg></div>
      <div id="barB"><span>NOS OCUPAMOS DEL<br><b>PATENTAMIENTO</b></span></div>
    </div>
  </div>

  <div id="s4" class="abs scene">
    <svg id="lines4" class="abs" viewBox="0 0 1080 1920" fill="none" stroke="#FF7F00" stroke-width="3" stroke-linecap="round"></svg>
    <img id="logo4" class="abs" src="../assets/brand/logo-rodados-blanco.png">
    <div id="cta" class="abs split">No dudes en consultar</div>
    <div id="pills4" class="abs">
      <span id="p4a" class="pill"><svg viewBox="0 0 48 48" fill="none" stroke="#1D1E1C" stroke-width="4.5" stroke-linejoin="round"><path d="M8 10 H40 Q43 10 43 13 V31 Q43 34 40 34 H22 L13 42 V34 H8 Q5 34 5 31 V13 Q5 10 8 10 Z"/><circle cx="15" cy="22" r="1.5" fill="#1D1E1C"/><circle cx="24" cy="22" r="1.5" fill="#1D1E1C"/><circle cx="33" cy="22" r="1.5" fill="#1D1E1C"/></svg>ESCRIBINOS POR MENSAJE</span>
      <span id="p4b" class="pill"><span class="tri"></span>MÁS QUE AUTOS, SOLUCIONES</span>
    </div>
  </div>

  <div id="wipe" class="abs"></div>
  <div id="glow" class="abs"></div>
  <div id="vig" class="abs"></div>
  <div id="grain" class="abs"></div>
  <div id="fade" class="abs"></div>
</div>

<script>
// Autos (PNG sin fondo). HERO va en el hook; BENEFITS[i].car en cada beneficio.
const CAR_DIR = '../assets/autos/grade/';
const HERO = 'toyota-rav4';
const BENEFITS = [
  { a: 'FINANCIACIÓN', b: 'A TASA FIJA', car: 'toyota-corolla' },
  { a: '0% INTERÉS', b: 'EN CUOTAS', car: 'ford-territory' },
  { a: 'ACEPTAMOS', b: 'TU USADO', car: 'toyota-sw4' },
];
const DURATION = 15.8;

// Línea de tiempo (segundos)
const T = {
  w1: 3.9,                  // hook -> logo
  w2: 5.7,                  // logo -> beneficios
  beats: [5.85, 8.0, 10.15],
  beatLen: 2.15,
  w3: 12.35,                // beneficios -> cierre
  wipeDur: 0.6,
};

// --- utilidades de animación ---
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, p) => a + (b - a) * p;
const eOut = p => 1 - Math.pow(1 - p, 3);
const eIn = p => p * p * p;
const eInOut = p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
const eBack = p => { const c = 1.70158, c3 = c + 1; return 1 + c3 * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); };
const $ = id => document.getElementById(id);
const css = (el, o) => Object.assign(el.style, o);
const show = (el, on) => { el.style.display = on ? 'block' : 'none'; };

// Letras separadas para animarlas de a una
document.querySelectorAll('.split').forEach(el => {
  el.innerHTML = [...el.textContent].map(c => `<span class="ch">${c}</span>`).join('');
});
const chars = id => [...$(id).querySelectorAll('.ch')];

// Autos
$('car1').querySelector('img').src = CAR_DIR + HERO + '.png';
const car3Els = BENEFITS.map(b => {
  const d = document.createElement('div');
  d.className = 'car abs';
  d.id = 'car3';
  d.innerHTML = `<div class="carBox"><div class="shadow"></div><img src="${CAR_DIR + b.car}.png"></div>`;
  $('cars3').appendChild(d);
  return d;
});

// Líneas diagonales (eco de los chevrones de la referencia, con la diagonal de la marca)
function chevrons(svg, groups) {
  svg.innerHTML = groups.map(([x, y, s, n, gap, op]) => {
    let d = '';
    for (let k = 0; k < n; k++) {
      const o = k * gap;
      d += `M${x - 160 * s + o} ${y - 420 * s} L${x + o} ${y} L${x + 160 * s + o} ${y - 420 * s} `;
    }
    return `<path d="${d}" opacity="${op}"/>`;
  }).join('');
}
chevrons($('lines2'), [[840, 2050, 2.6, 4, 70, .55], [840, 1100, 2.2, 3, 70, .25]]);
chevrons($('s3lines'), [[420, 1950, 1.25, 4, 52, .9], [860, 1990, 1.0, 3, 52, .55]]);
chevrons($('lines4'), [[150, 520, 1.1, 4, 48, .55], [930, 2060, 1.1, 4, 48, .55]]);
document.querySelectorAll('svg path').forEach(p => { try { p.dataset.len = p.getTotalLength(); } catch (e) {} });
const draw = (p, v) => { const L = +p.dataset.len; p.style.strokeDasharray = L; p.style.strokeDashoffset = L * (1 - v); };

// Barras diagonales: tapan toda la pantalla justo en el corte
function wipe(t) {
  for (const c of [T.w1, T.w2, T.w3]) {
    const p = prog(t, c - T.wipeDur / 2, c + T.wipeDur / 2);
    if (p > 0 && p < 1) {
      const x = lerp(2700, -2700, eInOut(p));
      return css($('wipe'), { display: 'block', transform: `translateX(${x}px) rotate(14deg)` });
    }
  }
  $('wipe').style.display = 'none';
}

// Revela de izquierda a derecha (p: 0..1) y sale hacia la derecha (q: 0..1)
const reveal = (el, p, q = 0) => { el.style.clipPath = `inset(-20px ${100 - p * 100}% -20px ${q * 100}%)`; };

let lastBeat = -1;
function render(t) {
  // ---------- Escena 1: hook ----------
  show($('s1'), t < T.w1);
  if (t < T.w1) {
    css($('s1bg'), { transform: `scale(${lerp(1.18, 1.04, eOut(prog(t, 0, T.w1)))})` });
    const wd = eOut(prog(t, 0.05, 0.7));
    css($('wedge'), { transform: `translateY(${lerp(700, 0, wd)}px)` });
    css($('wedgeLine'), { transform: `translateY(${lerp(700, 0, eOut(prog(t, 0.15, 0.8)))}px)` });
    const lg = eOut(prog(t, 0.1, 0.6));
    css($('logo1'), { opacity: lg, transform: `translateY(${lerp(-30, 0, lg)}px)` });
    chars('q').forEach((c, k) => {
      const p = eBack(prog(t, 0.25 + k * 0.05, 0.6 + k * 0.05));
      css(c, { opacity: prog(t, 0.25 + k * 0.05, 0.4 + k * 0.05), transform: `translateY(${lerp(60, 0, p)}px)` });
    });
    reveal($('band'), eInOut(prog(t, 0.7, 1.1)));
    chars('l3').forEach((c, k) => {
      const p = eBack(prog(t, 1.0 + k * 0.045, 1.35 + k * 0.045));
      css(c, { opacity: prog(t, 1.0 + k * 0.045, 1.15 + k * 0.045), transform: `translateY(${lerp(70, 0, p)}px)` });
    });
    const ok = eBack(prog(t, 1.35, 1.8));
    css($('okm'), { opacity: prog(t, 1.35, 1.5), transform: `scale(${lerp(1.5, 1, ok)})` });
    $('okm').querySelector('.f').style.opacity = eOut(prog(t, 1.8, 2.2));
    // El auto entra "manejando" desde la derecha y frena con un leve rebote
    const cp = prog(t, 1.95, 2.85);
    const cx = lerp(1250, 0, eOut(cp)) + Math.sin(prog(t, 2.6, 3.2) * Math.PI) * -12;
    const sq = 1 + Math.sin(prog(t, 2.55, 3.0) * Math.PI) * 0.012;
    css($('car1'), { transform: `translate(${cx + (t - 2.85 > 0 ? -(t - 2.85) * 8 : 0)}px, 0) scale(${sq})`, transformOrigin: '50% 85%' });
    // leve empuje de cámara hacia el final de la escena
    css($('hook'), { transform: `translateY(${-prog(t, 2.8, T.w1) * 10}px)` });
  }

  // ---------- Escena 2: logo ----------
  const in2 = t >= T.w1 && t < T.w2;
  show($('s2'), in2);
  if (in2) {
    const u = t - T.w1;
    $('lines2').querySelectorAll('path').forEach((p, k) => draw(p, eOut(prog(u, 0.05 + k * 0.1, 0.9 + k * 0.1))));
    css($('lines2'), { transform: `translate(${-u * 20}px, ${u * 10}px)` });
    const lg = eBack(prog(u, 0.25, 0.85));
    css($('logo2'), { opacity: prog(u, 0.25, 0.4), transform: `scale(${lerp(.55, 1, lg)})` });
    reveal($('logo2'), eOut(prog(u, 0.25, 0.75)));
    $('logo2').style.filter = `drop-shadow(0 0 ${lerp(0, 50, Math.sin(prog(u, 0.6, 1.8) * Math.PI))}px rgba(255,127,0,.45))`;
    const sg = eBack(prog(u, 0.8, 1.2));
    css($('slogan2'), { opacity: prog(u, 0.8, 0.95), transform: `scale(${lerp(.5, 1, sg)})` });
  }

  // ---------- Escena 3: beneficios ----------
  const in3 = t >= T.w2 && t < T.w3;
  show($('s3'), in3);
  if (in3) {
    const u = t - T.w2;
    css($('s3bg'), { transform: `scale(${lerp(1.12, 1.0, eOut(prog(u, 0, T.w3 - T.w2)))}) translateX(${-u * 6}px)` });
    $('s3lines').querySelectorAll('path').forEach((p, k) => draw(p, eOut(prog(u, 0.1 + k * 0.15, 1.2 + k * 0.15))));
    const dk = eOut(prog(u, 0, 0.5));
    css($('s3dark'), { transform: `translateY(${lerp(500, 0, dk)}px)` });
    css($('s3edge'), { transform: `translateY(${lerp(500, 0, eOut(prog(u, 0.08, 0.58)))}px)` });

    // beneficio activo
    let bi = 0;
    T.beats.forEach((b, i) => { if (t >= b) bi = i; });
    if (bi !== lastBeat) { $('tag1').textContent = BENEFITS[bi].a; $('tag2').textContent = BENEFITS[bi].b; lastBeat = bi; }
    const b = T.beats[bi], last = bi === T.beats.length - 1;
    const outA = last ? 99 : b + T.beatLen - 0.3;
    reveal($('tag1'), eOut(prog(t, b, b + 0.35)), eIn(prog(t, outA, outA + 0.22)));
    reveal($('tag2'), eOut(prog(t, b + 0.12, b + 0.47)), eIn(prog(t, outA + 0.05, outA + 0.27)));
    css($('tags'), { transform: `rotate(-6deg) translateX(${lerp(-40, 0, eOut(prog(t, b, b + 0.5)))}px)` });

    car3Els.forEach((el, i) => {
      const s = T.beats[i];
      const isLast = i === T.beats.length - 1;
      let x = lerp(1250, 0, eOut(prog(t, s + 0.05, s + 0.75)));
      if (!isLast) x = lerp(x, -1250, eIn(prog(t, s + T.beatLen - 0.3, s + T.beatLen + 0.05)));
      x -= clamp(t - s - 0.75, 0, 2) * 10;   // deriva lenta mientras está quieto
      const bob = Math.sin((t - s) * 2.4) * 3;
      css(el, { transform: `translate(${x}px, ${bob}px)`, display: Math.abs(x) > 1240 ? 'none' : 'block' });
    });

    // barra de patentamiento: entra con el primer beneficio y queda fija
    const ba = eBack(prog(t, T.beats[0] + 0.55, T.beats[0] + 0.95));
    css($('barA'), { transform: `scale(${lerp(0, 1, ba)})` });
    reveal($('barB'), eOut(prog(t, T.beats[0] + 0.8, T.beats[0] + 1.25)));
    draw($('check'), eOut(prog(t, T.beats[0] + 0.85, T.beats[0] + 1.2)));
    css($('bar'), { opacity: prog(t, T.beats[0] + 0.55, T.beats[0] + 0.65) });
  }

  // ---------- Escena 4: cierre ----------
  const in4 = t >= T.w3;
  show($('s4'), in4);
  if (in4) {
    const u = t - T.w3;
    $('lines4').querySelectorAll('path').forEach((p, k) => draw(p, eOut(prog(u, 0.05 + k * 0.12, 1.0 + k * 0.12))));
    const lg = eBack(prog(u, 0.15, 0.75));
    css($('logo4'), { opacity: prog(u, 0.15, 0.3), transform: `scale(${lerp(.6, 1, lg)})`,
      filter: `drop-shadow(0 0 ${lerp(0, 40, Math.sin(prog(u, 0.7, DURATION - T.w3) * Math.PI))}px rgba(255,127,0,.35))` });
    chars('cta').forEach((c, k) => {
      const p = eOut(prog(u, 0.6 + k * 0.025, 0.95 + k * 0.025));
      css(c, { opacity: p, transform: `translateY(${lerp(40, 0, p)}px)` });
    });
    [$('p4a'), $('p4b')].forEach((el, k) => {
      const p = eBack(prog(u, 1.25 + k * 0.25, 1.7 + k * 0.25));
      css(el, { opacity: prog(u, 1.25 + k * 0.25, 1.4 + k * 0.25), transform: `scale(${lerp(.5, 1, p)})` });
    });
  }

  wipe(t);
  const g = Math.floor(t * 30) * 7919 % 400;
  css($('grain'), { transform: `translate(${g % 200}px, ${(g * 3) % 200}px)` });
  css($('fade'), { opacity: Math.max(prog(t, DURATION - 0.35, DURATION), 1 - prog(t, 0, 0.2)) });
}

// Las pills del cierre no más anchas que el texto de arriba: se ajustan con las fuentes cargadas
function fitBar() {
  const s3 = $('s3'), prev = s3.style.display;
  s3.style.display = 'block';
  const span = $('barB').querySelector('span');
  let fs = 46; span.style.fontSize = fs + 'px';
  while ($('bar').offsetWidth > 900 && fs > 20) span.style.fontSize = (fs -= 0.5) + 'px';
  s3.style.display = prev;
}

window.DURATION = DURATION;
window.render = render;
window.ready = Promise.all([document.fonts.ready.then(fitBar), ...[...document.images].map(i => i.decode().catch(() => {}))]);

if (!navigator.webdriver) {
  const t0 = performance.now();
  (function loop() { render(((performance.now() - t0) / 1000) % DURATION); requestAnimationFrame(loop); })();
} else render(0);
</script>
